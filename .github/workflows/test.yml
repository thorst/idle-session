name: IdleSession Test Suite
on: [push]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run tests with coverage
        run: npm run coverage

      - name: Archive test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/

      - name: Assemble Pages site
        run: |
          mkdir _site
          cp index.html IdleSession.js IdleSession.d.ts _site/
          cp -r coverage _site/coverage
          NAV='<nav style="background:#1c1f26;border-bottom:1px solid #2e3340;padding:0.5rem 1.25rem;display:flex;gap:0.75rem;font-family:system-ui,sans-serif;font-size:0.8125rem;"><a href="/idle-session/" style="color:#6b7280;text-decoration:none;border:1px solid #2e3340;border-radius:6px;padding:0.2rem 0.6rem;">Kitchen Sink</a><a href="/idle-session/coverage/" style="color:#6b7280;text-decoration:none;border:1px solid #2e3340;border-radius:6px;padding:0.2rem 0.6rem;">Coverage</a></nav>'
          find _site/coverage -name "*.html" -exec sed -i "s|<body>|<body>${NAV}|" {} \;

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site/

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
